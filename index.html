<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Converter</title>
    <link rel="icon" href="icon.png">
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            height: 100%;
        }

        @media (min-width: 1440px) {

            html,
            body,
            input {
                font-size: 50px;
            }
        }
    </style>
</head>

<body>
    <img id="arrow" src="arrow.png" style="display: none;">
    <canvas id="canvas" width="350%" height="670px"></canvas>
    <div style="display: flex;flex-direction: column;">
        <div>
            <div id="language">Language.</div>
            <img id="changeLanguage" src="polandFlag.jpg" style="cursor: pointer;">
        </div>
        <div style="display: flex;flex-direction: column;">
            <div style="border-style: solid;display: flex;flex-direction: column;align-items: center;">
                <div id="romanIguessToInteger">Roman I guess to integer:
                </div>
                <input id="romanInput">
                <div id="integerOutput"></div>
            </div>
            <div style="border-style: solid;display: flex;flex-direction: column;align-items: center;">
                <div id="integerIguessToRoman">Integer I guess to Roman:
                </div>
                <input type="number" id="integerInput">
                <div id="romanOutput"></div>
            </div>
        </div>
    </div>
    <script>
        document.getElementById(`changeLanguage`).addEventListener(`click`, function () {
            if (document.getElementById(`changeLanguage`).src.includes(`polandFlag.jpg`)) {
                document.getElementById(`changeLanguage`).src = `unitedStatesFlag.jpg`
                document.getElementById(`romanIguessToInteger`).textContent = `Liczba rzymska chyba na liczbę całkowitą:`
                document.getElementById(`integerIguessToRoman`).textContent = `Liczba całkowita chyba na liczbę rzymską:`
                document.getElementById(`language`).textContent = `Język.`
                document.documentElement.setAttribute(`lang`, `pl`);
            } else {
                document.getElementById(`changeLanguage`).src = `polandFlag.jpg`
                document.getElementById(`romanIguessToInteger`).textContent = `Roman I guess to integer:`
                document.getElementById(`integerIguessToRoman`).textContent = `Integer I guess to Roman:`
                document.getElementById(`language`).textContent = `Language.`
                document.documentElement.setAttribute(`lang`, `en`);
            }
        })
        function integerToRoman(number) {
            let roman = ""
            while (number > 0) {
                if (number >= 1000) {
                    roman += "M"
                    number -= 1000;
                } else if (number >= 900) {
                    roman += "CM"
                    number -= 900;
                } else if (number >= 500) {
                    roman += "D"
                    number -= 500;
                } else if (number >= 400) {
                    roman += "CD"
                    number -= 400;
                } else if (number >= 100) {
                    roman += "C"
                    number -= 100;
                } else if (number >= 90) {
                    roman += "XC"
                    number -= 90;
                } else if (number >= 50) {
                    roman += "L"
                    number -= 50;
                } else if (number >= 40) {
                    roman += "XL"
                    number -= 40;
                } else if (number >= 10) {
                    roman += "X"
                    number -= 10;
                } else if (number >= 9) {
                    roman += "IX"
                    number -= 9;
                } else if (number >= 5) {
                    roman += "V"
                    number -= 5;
                } else if (number >= 4) {
                    roman += "IV"
                    number -= 4;
                } else if (number <= 3) {
                    roman += "I"
                    number -= 1;
                }
            }
            return roman;
        };

        function romanToInteger(roman) {
            let symbols = {
                "I": 1,
                "V": 5,
                "X": 10,
                "L": 50,
                "C": 100,
                "D": 500,
                "M": 1000
            };
            let value = 0;
            for (let i = 0; i < roman.length; i++) {
                if (i + 1 < roman.length && symbols[roman[i]] < symbols[roman[i + 1]]) {
                    value -= symbols[roman[i]];
                } else {
                    value += symbols[roman[i]];
                }
            }
            return value;
        };
        arrowY = 0
        direction = 1
        maxY = 100
        minY = 0
        function animateArrow() {
            canvas = document.getElementById("canvas")
            contex = canvas.getContext("2d")
            arrow = document.getElementById("arrow")
            contex.clearRect(0, 0, canvas.width, canvas.height);
            if (arrow.complete && arrow.naturalWidth != 0) {
                contex.drawImage(arrow, 0, arrowY);
            }
            arrowY += direction * 2
            if (arrowY >= maxY || arrowY <= minY) {
                direction *= -1
            }
            requestAnimationFrame(animateArrow)
        }
        window.addEventListener("DOMContentLoaded", function () {
            arrow = document.getElementById("arrow")
            if (arrow.complete && arrow.naturalWidth != 0) {
                animateArrow()
            } else {
                arrow.addEventListener("load", function () {
                    animateArrow()
                })
            }
        })
        document.getElementById("romanInput").addEventListener("input", function () {
            document.getElementById("integerOutput").innerText = romanToInteger(document.getElementById("romanInput").value)
        })
        document.getElementById("integerInput").addEventListener("input", function () {
            document.getElementById("romanOutput").innerText = integerToRoman(document.getElementById("integerInput").value)
        })
    </script>
</body>

</html>
